<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBank Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Hide scrollbar for modals to prevent duplicate scrollbars */
        .modal-content::-webkit-scrollbar {
            display: none;
        }
        .modal-content {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // API Base URL - CRITICAL: Use relative paths to avoid CORS issues with Flask
        const API_BASE = '/api';

        // Utility Function for API Calls
        const safeFetch = async (url, options = {}) => {
            try {
                const fetchOptions = {
                    method: options.method || 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    body: options.body
                };

                // CRITICAL: Include credentials for Flask session/cookie handling
                fetchOptions.credentials = 'include';

                console.log(`🔄 Fetching: ${url}`);
                const response = await fetch(url, fetchOptions);
                console.log(`📡 Response status: ${response.status}`);

                if (response.status === 401) {
                    console.error(`❌ 401 Unauthorized on ${url}`);
                    alert("Session expired. Please log in again.");
                    // Redirect to the login page defined in Flask
                    window.location.href = '/login'; 
                    return { isError: true, data: {} };
                }

                // Attempt to parse JSON, fall back to empty object/text if needed
                let data = {};
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    data = await response.json();
                } else {
                    data.message = await response.text();
                }


                if (!response.ok) {
                    console.error(`❌ API Error on ${url}:`, data);
                    return { isError: true, data: data };
                }

                console.log(`✅ Success: ${url}`);
                return { isError: false, data: data };
            } catch (error) {
                console.error(`💥 Fetch failed on ${url}:`, error);
                return { isError: true, data: { message: error.message } };
            }
        };

        const BloodBankSystem = () => {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [isLoading, setIsLoading] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [notifications, setNotifications] = useState(3);
            const [selectedBloodType, setSelectedBloodType] = useState('all');
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);

            // Data States
            const [donors, setDonors] = useState([]);
            const [inventory, setInventory] = useState([]);
            const [requests, setRequests] = useState([]);
            const [stats, setStats] = useState({});
            const [criticalStock, setCriticalStock] = useState([]);
            const [recentDonations, setRecentDonations] = useState([]);
            const [expiringStock, setExpiringStock] = useState([]);

            const bloodTypes = ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'];

            // --- Data Fetching (Memoized for Efficiency) ---

            const fetchDashboardData = useCallback(async () => {
                try {
                    console.log('📊 Fetching dashboard data...');
                    
                    // The backend API returns {success: true, stats: {...}} for stats, and arrays for the rest.
                    const [statsRes, criticalRes, recentRes, expiringRes] = await Promise.all([
                        safeFetch(`${API_BASE}/dashboard/stats`),
                        safeFetch(`${API_BASE}/dashboard/critical-stock`),
                        safeFetch(`${API_BASE}/dashboard/recent-donations`),
                        safeFetch(`${API_BASE}/dashboard/expiring-stock`)
                    ]);

                    if (statsRes.data?.success) {
                        setStats(statsRes.data.stats || {});
                    } else if (!statsRes.isError) {
                        setStats({});
                    }

                    if (Array.isArray(criticalRes.data)) {
                        // Backend returns 'units' as int/signed
                        setCriticalStock(criticalRes.data);
                    } else if (!criticalRes.isError) {
                        setCriticalStock([]); 
                    }

                    if (Array.isArray(recentRes.data)) {
                        setRecentDonations(recentRes.data);
                    } else if (!recentRes.isError) {
                        setRecentDonations([]);
                    }

                    if (Array.isArray(expiringRes.data)) {
                        setExpiringStock(expiringRes.data);
                    } else if (!expiringRes.isError) {
                        setExpiringStock([]);
                    }

                } catch (error) {
                    console.error('Error fetching dashboard data:', error);
                    setStats({});
                    setCriticalStock([]);
                    setRecentDonations([]);
                    setExpiringStock([]);
                }
            }, []);

            const fetchDonors = useCallback(async () => {
                setIsLoading(true);
                try {
                    const { isError, data } = await safeFetch(
                        // Backend filters by search and blood_type
                        `${API_BASE}/donors/all?search=${searchQuery}&blood_type=${selectedBloodType}`
                    );
                    if (!isError && Array.isArray(data)) { 
                        // Backend returns: id, name, blood, phone, email, location, lastDonation
                        setDonors(data);
                    } else {
                        setDonors([]);
                    }
                } catch (error) {
                    console.error('Error fetching donors:', error);
                    setDonors([]);
                }
                setIsLoading(false);
            }, [searchQuery, selectedBloodType]);

            const fetchInventory = useCallback(async () => {
                setIsLoading(true);
                try {
                    const { isError, data } = await safeFetch(`${API_BASE}/inventory/all`);
                    if (!isError && Array.isArray(data)) {
                        // Backend returns: blood, units, expiring, lastUpdated
                        setInventory(data);
                    } else {
                        setInventory([]);
                    }
                } catch (error) {
                    console.error('Error fetching inventory:', error);
                    setInventory([]);
                }
                setIsLoading(false);
            }, []);

            const fetchRequests = useCallback(async () => {
                setIsLoading(true);
                try {
                    const { isError, data } = await safeFetch(
                        `${API_BASE}/requests/all?search=${searchQuery}`
                    );
                    if (!isError && Array.isArray(data)) {
                        // Backend returns: id, patient, blood, units, hospital, status, contact
                        setRequests(data);
                    } else {
                        setRequests([]);
                    }
                } catch (error) {
                    console.error('Error fetching requests:', error);
                    setRequests([]);
                }
                setIsLoading(false);
            }, [searchQuery]);

            // --- Utility Functions ---

            const openModal = (type, item = null) => {
                setModalType(type);
                setSelectedItem(item);
                setShowModal(true);
            };

            const closeModal = () => {
                setShowModal(false);
                setModalType('');
                setSelectedItem(null);
            };

            // --- CRUD Handlers ---

            const handleSaveDonor = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const donorData = {
                    name: formData.get('name'),
                    blood: formData.get('blood'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                    location: formData.get('location'),
                    dob: formData.get('dob') || '1990-01-01', // DOB is required by backend schema but hidden in UI, mapping 'Last Donation' in UI to 'dob' in backend data is incorrect, using 'dob' placeholder
                };
                
                // Use 'LastDonation' name for form field, but client model sends 'dob' as a placeholder
                // This is a correction to use a placeholder DOB field since the backend requires it.
                donorData.dob = formData.get('lastDonation') || donorData.dob; 

                const url = selectedItem 
                    ? `${API_BASE}/donors/update/${selectedItem.id}`
                    : `${API_BASE}/donors/add`;
                
                const { isError, data } = await safeFetch(url, {
                    method: selectedItem ? 'PUT' : 'POST',
                    body: JSON.stringify(donorData)
                });
                
                if (!isError && data.success) {
                    alert(data.message);
                    closeModal();
                    fetchDonors();
                } else if (isError) {
                    alert('Failed to save donor: ' + (data.message || 'Unknown error'));
                }
            };
            
            const handleDeleteDonor = async (donorId) => {
                if (!confirm('Are you sure you want to delete this donor?')) return;

                const { isError, data } = await safeFetch(`${API_BASE}/donors/delete/${donorId}`, {
                    method: 'DELETE'
                });

                if (!isError && data.success) {
                    alert(data.message);
                    fetchDonors();
                } else if (isError) {
                    alert('Failed to delete donor: ' + (data.message || 'Unknown error'));
                }
            };

            const handleAddRequest = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const requestData = {
                    // Patient name is used as Hospital Name in the DB schema/API for simplicity in fetching (Request_ID: 101, Hospital_Name: 'Eve Lin')
                    patient: formData.get('patient'), 
                    blood: formData.get('blood'),
                    units: formData.get('units'),
                    hospital: formData.get('hospital'), // Mapped to City/Contact in DB, but used as Hospital_Name in API
                    notes: formData.get('notes')
                };

                const { isError, data } = await safeFetch(`${API_BASE}/requests/add`, {
                    method: 'POST',
                    body: JSON.stringify(requestData)
                });

                if (!isError && data.success) {
                    alert(data.message);
                    closeModal();
                    fetchRequests();
                    fetchDashboardData();
                } else if (isError) {
                    alert('Failed to add request: ' + (data.message || 'Unknown error'));
                }
            };

            const handleApproveRequest = async (requestId) => {
                try {
                    if (!confirm("Are you sure you want to fulfill this request? This will deduct stock.")) return;

                    const { isError, data } = await safeFetch(`${API_BASE}/requests/approve/${requestId}`, {
                        method: 'POST'
                    });

                    if (!isError && data.success) {
                        alert(data.message);
                        closeModal();
                        fetchRequests();
                        fetchDashboardData();
                    } else if (isError) {
                        alert('Failed to approve request: ' + (data.message || data.detail || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Error approving request:', error);
                    alert('Failed to approve request');
                }
            };

            const handleRejectRequest = async (requestId) => {
                if (!confirm("Are you sure you want to reject this request?")) return;
                
                const { isError, data } = await safeFetch(`${API_BASE}/requests/reject/${requestId}`, {
                    method: 'POST'
                });

                if (!isError && data.success) {
                    alert(data.message);
                    closeModal();
                    fetchRequests();
                } else if (isError) {
                    alert('Failed to reject request: ' + (data.message || 'Unknown error'));
                }
            };

            const handleAddStockSubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const stockData = {
                    blood_type: formData.get('blood_type'),
                    units: parseFloat(formData.get('units'))
                };

                const { isError, data } = await safeFetch(`${API_BASE}/inventory/add-stock`, {
                    method: 'POST',
                    body: JSON.stringify(stockData)
                });

                if (!isError && data.success) {
                    alert(data.message);
                    closeModal();
                    fetchInventory();
                    fetchDashboardData();
                } else if (isError) {
                    alert('Failed to add stock: ' + (data.message || 'Unknown error'));
                }
            };

            // Handle Export Inventory (Client-side CSV generation)
            const handleExportInventory = () => {
                try {
                    let csvContent = "Blood Type,Units Available,Expiring Soon,Last Updated\n";
                    
                    inventory.forEach(item => {
                        csvContent += `${item.blood},${item.units},${item.expiring},"${item.lastUpdated}"\n`;
                    });
                    
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    const url = URL.createObjectURL(blob);
                    
                    link.setAttribute('href', url);
                    link.setAttribute('download', `blood_inventory_${new Date().toISOString().split('T')[0]}.csv`);
                    link.style.visibility = 'hidden';
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    alert('Inventory exported successfully!');
                } catch (error) {
                    console.error('Error exporting inventory:', error);
                    alert('Failed to export inventory');
                }
            };


            // --- UseEffects for Data & UI Sync ---

            useEffect(() => {
                if (currentPage === 'dashboard') {
                    fetchDashboardData();
                } else if (currentPage === 'inventory') {
                    fetchInventory();
                }
                // Re-initialize Lucide icons for the main page content after data fetch might occur
                lucide.createIcons();
            }, [currentPage, fetchDashboardData, fetchInventory]);

            useEffect(() => {
                if (currentPage === 'donors') {
                    const timer = setTimeout(() => {
                        fetchDonors();
                    }, 500);
                    return () => clearTimeout(timer);
                } else if (currentPage === 'requests') {
                    const timer = setTimeout(() => {
                        fetchRequests();
                    }, 500);
                    return () => clearTimeout(timer);
                }
            }, [searchQuery, selectedBloodType, currentPage, fetchDonors, fetchRequests]);

            // CRITICAL FIX: Dedicated useEffect for modal icon initialization
            useEffect(() => {
                // This ensures icons inside the modal render correctly after it appears
                if (showModal) {
                     setTimeout(() => lucide.createIcons(), 50);
                }
                // Also ensure icons on the main page render when the modal closes
                lucide.createIcons();
            }, [showModal, modalType]); 


            // --- UI Components ---

            // Modal Component (Integrated and Corrected)
            const Modal = ({ type, item }) => {
                return (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                        <div className="bg-white rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto modal-content">
                            <div className="p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800">
                                        {type === 'addDonor' && 'Add New Donor'}
                                        {type === 'editDonor' && 'Edit Donor'}
                                        {type === 'addRequest' && 'New Blood Request'}
                                        {type === 'viewDetails' && 'Request Details'}
                                        {type === 'addStock' && 'Add Blood Stock'}
                                    </h2>
                                    <button onClick={closeModal} className="text-gray-500 hover:text-gray-700">
                                        <i data-lucide="x-circle" className="w-6 h-6"></i>
                                    </button>
                                </div>

                                {/* Donor/Edit Form */}
                                {(type === 'addDonor' || type === 'editDonor') && (
                                    <form onSubmit={handleSaveDonor} className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                                <input name="name" type="text" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" defaultValue={item?.name} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Blood Type</label>
                                                <select name="blood" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" defaultValue={item?.blood}>
                                                    {bloodTypes.map(type => <option key={type} value={type}>{type}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                                                <input name="phone" type="tel" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" defaultValue={item?.phone} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                                <input name="email" type="email" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" defaultValue={item?.email} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Location</label>
                                                <input name="location" type="text" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" defaultValue={item?.location} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Last Donation Date (DOB Placeholder in API)</label>
                                                {/* Note: This field is used as a proxy for the required 'dob' in the backend API logic provided. */}
                                                <input name="lastDonation" type="date" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" defaultValue={item?.lastDonation} />
                                            </div>
                                        </div>
                                        <div className="flex gap-3 mt-6">
                                            <button type="submit" className="flex-1 bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                                                {type === 'addDonor' ? 'Add Donor' : 'Update Donor'}
                                            </button>
                                            <button type="button" onClick={closeModal} className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">
                                                Cancel
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {/* Add Request Form */}
                                {type === 'addRequest' && (
                                    <form onSubmit={handleAddRequest} className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Patient Name/Hospital Requesting</label>
                                                <input name="patient" type="text" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Blood Type</label>
                                                <select name="blood" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent">
                                                    {bloodTypes.map(type => <option key={type} value={type}>{type}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Units Needed (Whole Blood)</label>
                                                <input name="units" type="number" required min="1" step="1" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Hospital Contact/City</label>
                                                <input name="hospital" type="text" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="e.g., City or Contact Name" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Additional Notes</label>
                                            <textarea name="notes" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" rows="3"></textarea>
                                        </div>
                                        <div className="flex gap-3 mt-6">
                                            <button type="submit" className="flex-1 bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                                                Submit Request
                                            </button>
                                            <button type="button" onClick={closeModal} className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">
                                                Cancel
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {/* Add Stock Form */}
                                {type === 'addStock' && (
                                    <form onSubmit={handleAddStockSubmit} className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Blood Type</label>
                                                <select name="blood_type" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent">
                                                    {bloodTypes.map(type => <option key={type} value={type}>{type}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Units to Add (Whole Blood)</label>
                                                <input name="units" type="number" required min="0.1" step="0.1" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" />
                                            </div>
                                        </div>
                                        <div className="flex gap-3 mt-6">
                                            <button type="submit" className="flex-1 bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                                                Add Stock
                                            </button>
                                            <button type="button" onClick={closeModal} className="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">
                                                Cancel
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {/* View Details Modal */}
                                {type === 'viewDetails' && item && (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="p-4 bg-gray-50 rounded-lg">
                                                <p className="text-sm text-gray-600">Patient/Requesting Hospital</p>
                                                <p className="font-semibold">{item.patient}</p>
                                            </div>
                                            <div className="p-4 bg-gray-50 rounded-lg">
                                                <p className="text-sm text-gray-600">Blood Type</p>
                                                <p className="font-semibold text-red-600">{item.blood}</p>
                                            </div>
                                            <div className="p-4 bg-gray-50 rounded-lg">
                                                <p className="text-sm text-gray-600">Units Required</p>
                                                <p className="font-semibold">{item.units} units (Whole Blood)</p>
                                            </div>
                                            <div className="p-4 bg-gray-50 rounded-lg">
                                                <p className="text-sm text-gray-600">Hospital/City</p>
                                                <p className="font-semibold">{item.hospital}</p>
                                            </div>
                                            <div className="p-4 bg-gray-50 rounded-lg">
                                                <p className="text-sm text-gray-600">Contact/City Detail</p>
                                                <p className="font-semibold">{item.contact}</p>
                                            </div>
                                            <div className="p-4 bg-gray-50 rounded-lg">
                                                <p className="text-sm text-gray-600">Status</p>
                                                <p className={`font-semibold capitalize ${item.status === 'pending' ? 'text-yellow-600' : 'text-green-600'}`}>{item.status}</p>
                                            </div>
                                        </div>
                                        <div className="p-4 bg-gray-50 rounded-lg col-span-2">
                                            <p className="text-sm text-gray-600">Request Date</p>
                                            <p className="font-semibold">{item.date}</p>
                                        </div>
                                        {item.status === 'pending' && (
                                            <div className="flex gap-3 mt-6">
                                                <button onClick={() => handleApproveRequest(item.id)} className="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center justify-center gap-2">
                                                    <i data-lucide="check-circle" className="w-5 h-5"></i> Approve
                                                </button>
                                                <button onClick={() => handleRejectRequest(item.id)} className="flex-1 bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition flex items-center justify-center gap-2">
                                                    <i data-lucide="x-circle" className="w-5 h-5"></i> Reject
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            // Sidebar Component
            const Sidebar = () => {
                // Initialize icons after component renders
                useEffect(() => {
                    lucide.createIcons();
                }, [currentPage]);

                return (
                    <div className="w-64 bg-gradient-to-b from-red-600 to-red-700 text-white h-screen flex flex-col shadow-2xl">
                        <div className="p-6 border-b border-red-500">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-600 w-6 h-6"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                                </div>
                                <div>

                                                        </td>
                                                        <td className="px-6 py-4">
                                                            <span className="font-semibold text-gray-800">{req.units} units</span>
                                                        </td>
                                                        <td className="px-6 py-4 text-sm text-gray-600">{req.hospital}</td>
                                                        <td className="px-6 py-4">
                                                            <span className={`px-3 py-1 rounded-lg text-xs font-semibold capitalize ${
                                                                req.status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                                                                req.status === 'fulfilled' ? 'bg-green-100 text-green-700' :
                                                                'bg-gray-100 text-gray-700'
                                                            }`}>
                                                                {req.status}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4">
                                                            <div className="flex items-center gap-2">
                                                                <button
                                                                    onClick={() => openModal('viewDetails', req)}
                                                                    className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition"
                                                                    title="View Details"
                                                                >
                                                                    <i data-lucide="eye" className="w-4 h-4"></i>
                                                                </button>
                                                                {req.status === 'pending' && (
                                                                    <button
                                                                        onClick={() => handleApproveRequest(req.id)}
                                                                        className="p-2 text-green-600 hover:bg-green-50 rounded-lg transition"
                                                                        title="Approve Request"
                                                                    >
                                                                        <i data-lucide="check-circle" className="w-4 h-4"></i>
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // Main Return
            return (
                <div className="flex h-screen bg-gray-100">
                    <Sidebar />
                    <div className="flex-1 overflow-y-auto">
                        <Header />
                        <div className="p-8">
                            {currentPage === 'dashboard' && <Dashboard />}
                            {currentPage === 'donors' && <DonorsPage />}
                            {currentPage === 'inventory' && <InventoryPage />}
                            {currentPage === 'requests' && <RequestsPage />}
                        </div>
                    </div>
                    {showModal && <Modal type={modalType} item={selectedItem} />}
                </div>
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BloodBankSystem />);
        
        // Final initialization of Lucide Icons
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
